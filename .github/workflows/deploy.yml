name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

# UN SEUL DEPLOIEMENT A LA FOIS, LES SUIVANTS ATTENDENT.
#
# Le 12/11/2026, deux PR fusionnees a 40 secondes d'intervalle ont lance deux
# deploiements simultanes sur le meme serveur (#252 et #253). Le second a
# refait `git reset`, `npm install` et `prisma generate` PENDANT le build du
# premier, et a echoue au bout de 31 secondes — sans aucun defaut dans le code.
#
# `cancel-in-progress: false` : on n'interrompt JAMAIS un deploiement en cours.
# Le couper au milieu de `prisma migrate deploy` ou du build laisserait le
# serveur dans un etat intermediaire ; le suivant attend son tour. Si plusieurs
# s'accumulent, GitHub ne garde que le plus recent en attente — c'est lui qui
# porte tout le code, rien n'est perdu.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          # Lightsail 1GB RAM swaps heavily during next build with Turbopack.
          # Default 10 min timeout is not enough — bumped to 30 min.
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/salonista
            # Pull the latest deploy.sh BEFORE running it, so we never execute
            # a stale copy whose body changes mid-run when the script self-updates.
            #
            # Le fetch ne doit JAMAIS attendre un identifiant : la session SSH
            # n'a pas de terminal, d'ou « could not read Username for
            # 'https://github.com': No such device or address ». Sans
            # GIT_TERMINAL_PROMPT=0, le job reste bloque jusqu'au timeout de
            # 30 minutes sur une invite que personne ne verra.
            export GIT_TERMINAL_PROMPT=0
            # HTTPS anonyme d'abord (le depot est public), repli SSH ensuite
            # si une cle de deploiement est installee.
            git remote set-url origin https://github.com/eyaalimi/salonista.git
            if ! git -c credential.helper= \
                   -c "http.https://github.com/.extraHeader=" \
                   fetch --all --prune; then
              echo "HTTPS a echoue — tentative en SSH"
              git remote set-url origin git@github.com:eyaalimi/salonista.git
              git fetch --all --prune
            fi
            git reset --hard origin/main
            bash ./scripts/deploy/deploy.sh
