name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          # Lightsail 1GB RAM swaps heavily during next build with Turbopack.
          # Default 10 min timeout is not enough — bumped to 30 min.
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/salonista
            # Pull the latest deploy.sh BEFORE running it, so we never execute
            # a stale copy whose body changes mid-run when the script self-updates.
            #
            # L'URL est forcee en HTTPS anonyme : un clone portant un jeton
            # expire faisait echouer le fetch avec « could not read Username
            # for 'https://github.com': No such device or address » — la
            # session SSH n'a pas de terminal ou saisir un identifiant. Le
            # depot est public, aucun identifiant n'est necessaire pour lire.
            git remote set-url origin https://github.com/eyaalimi/salonista.git
            git -c credential.helper= fetch --all --prune
            git reset --hard origin/main
            bash ./scripts/deploy/deploy.sh
