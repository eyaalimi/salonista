name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/salonista
            # Pull the latest deploy.sh BEFORE running it, so we never execute
            # a stale copy whose body changes mid-run when the script self-updates.
            git fetch --all --prune
            git reset --hard origin/main
            bash ./scripts/deploy/deploy.sh
