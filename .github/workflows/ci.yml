name: CI

# Bloque les pull requests : CLAUDE.md affirmait que le lint tournait en CI,
# ce qui etait faux — aucun workflow ne le lancait. C'est desormais vrai.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une PR mise a jour annule l'execution precedente : sans cela, chaque push
# empile une CI complete de plusieurs minutes sur la meme branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm install` et NON `npm ci`, comme le fait deploy.sh.
      #
      # `npm ci` exige que package-lock.json corresponde exactement a ce que
      # npm resoudrait. Or le lock contient des dependances OPTIONNELLES
      # WebAssembly (@emnapi, @napi-rs/wasm-runtime, tirees par Tailwind et
      # Rolldown) dont npm choisit des versions differentes selon la version
      # de Node. Le lock a ete genere sous Node 24 ; sous Node 20 — celui de
      # la production — `npm ci` reclame @emnapi/core@1.10.0 et echoue.
      #
      # Exiger `npm ci` ici rendrait la CI PLUS stricte que le deploiement,
      # donc capable de bloquer une PR pour une difference que la production
      # ne verra jamais.
      - name: Installer les dependances
        run: npm install --no-audit --no-fund

      # Le client Prisma est gitignore : sans cette etape, tout ce qui suit
      # echoue sur des imports introuvables.
      - name: Generer le client Prisma
        run: npx prisma generate

      - name: Verifier les types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # `next build` prerend la page d'accueil, qui interroge Postgres. Sans
      # base, il echoue sur ECONNREFUSED apres avoir compile — ce qui ne dit
      # rien de la qualite du code. On lance donc un vrai Postgres, et on y
      # applique les migrations : le prerendu lit de vraies tables.
      #
      # Effet de bord utile : une migration cassee fait echouer la CI ici.
      - name: Appliquer les migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salonista_test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salonista_test
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret-sans-valeur-en-production

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salonista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
